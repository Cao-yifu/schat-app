<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Schat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schat">
<meta name="theme-color" content="#121715">
<link rel="manifest" href="./manifest.webmanifest?v=56">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=56">
<link rel="icon" type="image/png" href="./icons/icon-192.png?v=56">
<link rel="stylesheet" href="./css/style.css?v=56">
</head>
<body>

<!-- 联系人列表页 -->
<div id="page-home" class="page active">
  <div class="hd">
    <div class="ttl">Schat</div>
    <div class="acts">
      <div class="act" id="homeHelpBtn">?</div>
      <div class="act" id="homeSetBtn">⚙</div>
    </div>
  </div>
  <div class="scroll"><div class="list" id="homeList"></div><div class="verline" id="verLine"></div></div>
</div>

<!-- 聊天页 -->
<div id="page-chat" class="page">
  <div class="hd">
    <div class="back" id="chatBackBtn">‹</div>
    <div class="ttl" style="text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="chatName">…</div>
    <div class="sub" id="chatSub"></div>
    <div class="acts"><div class="act" id="chatMenuBtn">⋯</div></div>
  </div>
  <div class="scroll chat-scroll" id="chatScroll"></div>
  <div class="quotebar" id="quoteBar"><span class="qt" id="quoteText"></span><span class="qx" id="quoteClose">✕</span></div>
  <div class="inbar">
    <div class="hold"><textarea id="inp" rows="1" placeholder=""></textarea></div>
    <button class="send" id="sendBtn">发送</button>
  </div>
</div>

<!-- 设置页 -->
<div id="page-set" class="page">
  <div class="hd">
    <div class="back" id="setBackBtn">‹</div>
    <div class="ttl">设置</div>
    <div class="acts"></div>
  </div>
  <div class="scroll"><div style="padding:0 16px 32px" id="setBody"></div></div>
</div>

<!-- 人设详情页 -->
<div id="page-profile" class="page">
  <div class="hd">
    <div class="back" id="profileBackBtn">‹</div>
    <div class="ttl" id="profileName">…</div>
    <div class="acts"></div>
  </div>
  <div class="scroll"><div style="padding:0 16px 32px" id="profileBody"></div></div>
</div>

<!-- 帮助页 -->
<div id="page-help" class="page">
  <div class="hd">
    <div class="back" id="helpBackBtn">‹</div>
    <div class="ttl">帮助</div>
    <div class="acts"></div>
  </div>
  <div class="scroll"><div style="padding:0 16px 32px" id="helpBody"></div></div>
</div>

<!-- 气泡长按弹层 -->
<div class="mask" id="maskSheet"></div>
<div class="sheet" id="sheetMsg">
  <div class="si" id="siQuote">↩ 引用回复</div>
  <div class="si" id="siCopy">⧉ 复制</div>
  <div class="si cancel">取消</div>
</div>

<!-- 聊天 ⋯ 弹层 -->
<div class="mask" id="maskChat"></div>
<div class="sheet" id="sheetChat">
  <div class="si" id="miProfile">📖 TA 的人设与记忆</div>
  <div class="si" id="miClearChat">🗑 清空聊天记录</div>
  <div class="si" id="miResetTime">⏱ 重置时间快进</div>
  <div class="si" id="miDelete">🚫 删除这个角色</div>
  <div class="si cancel">取消</div>
</div>

<!-- 首次引导 -->
<div class="onboard" id="onboard">
  <div class="bx">
    <h3>开始之前，两件事</h3>
    <p><b>1. 加到主屏幕</b>（iPhone）：</p>
    <ol>
      <li>Safari 打开本页</li>
      <li>点底部「分享」按钮</li>
      <li>选「添加到主屏幕」→ 完成</li>
    </ol>
    <p><b>2. 填 API Key</b>：右上角 ⚙ → AI 接口 → 填入你的 DeepSeek API Key，TA 才会真正开口。</p>
    <p style="margin-top:8px">聊天中可用：<span style="color:var(--sage)">RS+内容</span> 永久改人设、<span style="color:var(--sage)">LS+内容</span> 临时调整、<span style="color:var(--sage)">【3小时后】</span> 快进时间；长按气泡可引用回复。</p>
    <button class="gbtn" id="onboardOk">知道了</button>
  </div>
</div>

<div id="toast"></div>

<script src="./js/core/personas.js?v=56"></script>
<script src="./js/core/util.js?v=56"></script>
<script src="./js/core/store.js?v=56"></script>
<script src="./js/core/timeparse.js?v=56"></script>
<script src="./js/core/prompt.js?v=56"></script>
<script src="./js/core/api.js?v=56"></script>
<script src="./js/core/sync.js?v=56"></script>
<script src="./js/core/photo_pools.js?v=56"></script>
<script src="./js/core/photos.js?v=56"></script>
<script src="./js/core/intim_corpus.js?v=56"></script>
<script src="./js/core/engine.js?v=56"></script>
<script src="./js/ui/app.js?v=57"></script>
<script src="./js/main.js?v=56"></script>
</body>
</html>
