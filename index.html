<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Schat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schat">
<meta name="theme-color" content="#121715">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=16">
<link rel="icon" type="image/png" href="./icons/icon-192.png?v=16">
<link rel="stylesheet" href="./style.css?v=16">
</head>
<body>

<!-- 聊天（首页） -->
<div id="page-home" class="page tabpage active">
  <div class="hd">
    <div class="ttl">Schat</div>
    <div class="acts"><div class="act" id="homeAddBtn">＋</div></div>
  </div>
  <div class="scroll"><div class="list" id="homeList"></div></div>
</div>

<!-- 聊天页 -->
<div id="page-chat" class="page">
  <div class="hd">
    <div class="back" id="chatBackBtn">‹</div>
    <div class="ttl" style="flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="chatName">…</div>
    <div class="acts"><div class="act" id="chatMenuBtn">⋯</div></div>
  </div>
  <div class="scroll chat-scroll" id="chatScroll"></div>
  <div class="quotebar" id="quoteBar"><span class="qt" id="quoteText"></span><span class="qx" id="quoteClose">✕</span></div>
  <div class="inbar">
    <div class="hold"><textarea id="inp" rows="1" placeholder=""></textarea></div>
    <button class="send" id="sendBtn">发送</button>
  </div>
</div>

<!-- 角色页 -->
<div id="page-roles" class="page tabpage">
  <div class="hd"><div class="ttl">角色</div><div class="acts"></div></div>
  <div class="scroll"><div class="list" id="rolesList"></div></div>
</div>

<!-- 角色详情页 -->
<div id="page-roleDetail" class="page">
  <div class="hd">
    <div class="back" id="roleBackBtn">‹</div>
    <div class="ttl" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="roleName">…</div>
    <div class="acts"></div>
  </div>
  <div class="scroll"><div class="bd" id="roleBody"></div></div>
</div>

<!-- 朋友圈页 -->
<div id="page-moments" class="page tabpage">
  <div class="hd"><div class="ttl">朋友圈</div><div class="acts"></div></div>
  <div class="scroll"><div class="moments" id="momentsList"></div></div>
</div>

<!-- 设置页 -->
<div id="page-set" class="page tabpage">
  <div class="hd"><div class="ttl">设置</div><div class="acts"></div></div>
  <div class="scroll"><div class="bd" id="pageSetBody"></div></div>
</div>

<!-- 底部标签栏（微信式四界面） -->
<nav class="tabbar show" id="tabbar">
  <div class="tab on" data-tab="home">
    <span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h16a1.5 1.5 0 0 1 1.5 1.5v9.5a1.5 1.5 0 0 1-1.5 1.5H10l-5 4.5V17H4A1.5 1.5 0 0 1 2.5 15.5V6A1.5 1.5 0 0 1 4 4.5z"/><path d="M8 9.5h8M8 12.5h5"/></svg></span>
    <span class="tl">聊天</span>
    <span class="badge" id="tabUnread"></span>
  </div>
  <div class="tab" data-tab="roles">
    <span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg></span>
    <span class="tl">角色</span>
  </div>
  <div class="tab" data-tab="moments">
    <span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M8.6 13.2c0-2.9 1.5-4.7 3.4-4.7s3.4 1.8 3.4 4.7"/><circle cx="15.4" cy="11.2" r="0.4" fill="currentColor"/></svg></span>
    <span class="tl">朋友圈</span>
  </div>
  <div class="tab" data-tab="set">
    <span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/></svg></span>
    <span class="tl">设置</span>
  </div>
</nav>

<!-- ＋ 弹层 -->
<div class="mask" id="mask-sheetPlus"></div>
<div class="sheet" id="sheetPlus">
  <div class="si" id="miNew">✨ 新建秘密情人</div>
  <div class="si" id="miSettings">⚙ 设置与备份</div>
  <div class="si" id="miHelp">❓ 帮助</div>
  <div class="si" id="miExport">⬇ 导出备份</div>
  <div class="si cancel">取消</div>
</div>

<!-- 聊天 ⋯ 弹层 -->
<div class="mask" id="mask-sheetChat"></div>
<div class="sheet" id="sheetChat">
  <div class="si" id="miPersona">📖 TA的人设与记忆库</div>
  <div class="si" id="miExtract">🧠 从最近聊天提取记忆</div>
  <div class="si" id="miClearChat">🗑 清空聊天记录</div>
  <div class="si" id="miHelp2">❓ 帮助</div>
  <div class="si cancel">取消</div>
</div>

<!-- 人设面板 -->
<div class="panel" id="panelPersona">
  <div class="hd"><div class="back" onclick="closePanel('panelPersona')">‹</div><div class="ttl">TA的人设与记忆库</div><div class="acts"></div></div>
  <div class="bd" id="panelPersonaBody"></div>
</div>

<!-- 设置面板 -->
<div class="panel" id="panelSettings">
  <div class="hd"><div class="back" onclick="closePanel('panelSettings')">‹</div><div class="ttl">设置</div><div class="acts"></div></div>
  <div class="bd" id="panelSettingsBody"></div>
</div>

<!-- 新建面板 -->
<div class="panel" id="panelAdd">
  <div class="hd"><div class="back" onclick="closePanel('panelAdd')">‹</div><div class="ttl">新建秘密情人</div><div class="acts"></div></div>
  <div class="bd" id="panelAddBody"></div>
</div>

<!-- 帮助面板 -->
<div class="panel" id="panelHelp">
  <div class="hd"><div class="back" onclick="closePanel('panelHelp')">‹</div><div class="ttl">帮助</div><div class="acts"></div></div>
  <div class="bd" id="panelHelpBody"></div>
</div>

<!-- 首次引导 -->
<div class="onboard" id="onboard">
  <div class="bx">
    <h3>开始之前，两件事</h3>
    <p><b>1. 加到主屏幕</b>（iPhone）：</p>
    <ol>
      <li>Safari 打开本页</li>
      <li>点底部「分享」按钮</li>
      <li>选「添加到主屏幕」→ 完成</li>
    </ol>
    <p><b>2. 填 API Key</b>：底部「设置」页 → AI 接口 → 填入你的 DeepSeek API Key，TA 才会真正开口。</p>
    <button class="gbtn" id="onboardOk">知道了</button>
  </div>
</div>

<div id="toast"></div>
<script src="./sun_duo.js?v=16"></script>
<script src="./lovers.js?v=16"></script>
<script src="./moments.js?v=16"></script>
<script src="./app.js?v=16"></script>
</body>
</html>
